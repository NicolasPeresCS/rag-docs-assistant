[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-docs-assistant"
version = "0.1.0"
description = "Assistente RAG com citação de fontes: busca híbrida (BM25 + embeddings), LLM Claude, API FastAPI e interface Streamlit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "anthropic>=0.40", "pypdf>=4.0"]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
dense = ["sentence-transformers>=3.0", "numpy>=1.26"]
dev = ["pytest>=8.0", "httpx>=0.27", "reportlab>=4.0", "numpy>=1.26", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
